    <main>
        <h1>Commision me!</h1>
     <section>
            <h2>Commission Request</h2>
            <form id="commissionForm" action="action.html" method="GET">
                
                <!-- Username / Alias -->
                <div class="form-group">
                    <label for="username">Username / Alias:</label>
                    <input type="text" id="username" name="username" required placeholder="Your handle">
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required placeholder="name@example.com">
                </div>

                <!-- Company Name (Optional) -->
                <div class="form-group">
                    <label for="company">Company Name (Optional):</label>
                    <input type="text" id="company" name="company" placeholder="Business entities only">
                </div>

                <div class="form-group">
                        <button type="button" id="openSpecsBtn" class="info-modal-btn">
                        ℹ️ View Tier Descriptions & Samples
                        </button>
                </div>
                <!-- Commission Type -->
                <div class="form-group">
                    <label for="commission_type">Commission Type:</label>
                    <select id="commission_type" name="commission_type" required>
                        <option value="" disabled selected>Select an option</option>
                        <option value="Sketch ($5)">Sketch - $5</option>
                        <option value="Full Drawing ($30)">Full Drawing - $30</option>
                        <option value="Model Commission ($60)">Model Commission - $60</option>
                    </select>
                </div>

                <!-- Additional Characters (Optional) -->
                <div class="form-group">
                    <label for="additional_characters">Number of Additional Characters (Optional):</label>
                    <input type="number" id="additional_characters" name="additional_characters" min="0" placeholder="0">
                </div>

                <!-- Complex Background (Optional) -->
                <div class="form-group-inline">
                    <input type="checkbox" id="complex_background" name="complex_background" value="Yes">
                    <label for="complex_background">Include Complex Background</label>
                </div>

                <!-- NSFW Art/Model (Optional) -->
                <div class="form-group-inline">
                    <input type="checkbox" id="nsfw" name="nsfw" value="Yes">
                    <label for="nsfw">NSFW Art / Model Content</label>
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label for="description">Solicitation Description:</label>
                    <textarea id="description" name="description" rows="6" required placeholder="Describe your character, references, and scene ideas here..."></textarea>
                </div>

                <button type="submit">Submit Request</button>
            </form>
        </section>

        
</div>

    <dialog id="tierSpecsModal" class="accessible-modal">
        <div class="modal-header">
            <h2>Commission Tiers Detailed</h2>
            <button type="button" id="closeSpecsBtn" class="close-modal-btn" aria-label="Close dialog">✕</button>
        </div>
        
        <div id="modalBody" class="modal-body">
            <p>Loading tier details...</p>
        </div>
    </dialog>
